name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (build + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

  pipeline:
    name: pipeline (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q

  frontend:
    name: frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Sempre roda (inclui pull_request) — é o gate de fluxo feliz.
    if: ${{ always() && (github.event_name != 'pull_request' || true) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: singular
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d singular"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/singular
      REDIS_URL: redis://localhost:6379
      PORT: '3001'
      AUTH_DISABLED: 'true'
      BETTER_AUTH_SECRET: ci-e2e-dummy-secret-not-real
      BETTER_AUTH_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:5190
      CORS_ORIGINS: http://localhost:5190
      UPLOAD_DIR: ./uploads
      E2E_BASE_URL: http://localhost:5190
      # CI roda o build de produção via vite preview (o webServer do
      # playwright.config.ts sobe este comando porque reuseExistingServer=false).
      E2E_WEB_COMMAND: npm --prefix frontend run preview -- --port 5190 --strictPort
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Build backend
        run: npm --prefix backend run build

      - name: Build frontend (aponta para a API local do job)
        run: npm --prefix frontend run build
        env:
          VITE_API_URL: http://localhost:3001/api
          VITE_AUTH_DISABLED: 'true'

      - name: Migrate database
        run: npm --prefix backend run db:migrate

      - name: Start API (dist)
        run: |
          node backend/dist/index.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/health && exit 0
            sleep 1
          done
          echo "API não subiu em 30s" && exit 1

      # Workers (OCR/classificação) não sobem: os specs usam a prova
      # sintética injetada direto no banco pelo seed — nada passa pelo pipeline.

      - name: Run Playwright e2e
        run: npx playwright test --config e2e/playwright.config.ts

      - name: Upload Playwright report (falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
