<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400">
  <defs>
    <filter id="sg-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="sg-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E36002" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#E36002" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E36002" stop-opacity="0"/>
    </radialGradient>
    <path id="sg-orbit" d="M 190 196 m -118 0 a 118 52 0 1 1 236 0 a 118 52 0 1 1 -236 0" fill="none"/>
  </defs>
  <rect width="920" height="400" fill="#09090B"/>
  <rect x="0.5" y="0.5" width="919" height="399" fill="none" stroke="#2a2a30"/>

  <text x="48" y="46" font-family="ui-monospace,'Fira Code',monospace" font-size="12.5" letter-spacing="3" fill="#8B5CF6">PIPELINE — DOCUMENTO CAI, QUIZ SAI</text>
  <line x1="48" y1="60" x2="872" y2="60" stroke="#2a2a30"/>

  <!-- the singularity: accretion disk swallowing documents -->
  <ellipse cx="190" cy="196" rx="140" ry="64" fill="url(#sg-disk)"/>
  <g fill="none" stroke-width="2">
    <ellipse cx="190" cy="196" rx="118" ry="52" stroke="#E36002" stroke-opacity="0.8" stroke-dasharray="60 30" filter="url(#sg-glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 190 196" to="360 190 196" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="190" cy="196" rx="86" ry="38" stroke="#F97316" stroke-opacity="0.6" stroke-dasharray="30 22">
      <animateTransform attributeName="transform" type="rotate" from="360 190 196" to="0 190 196" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="190" cy="196" rx="56" ry="24" stroke="#8B5CF6" stroke-opacity="0.7" stroke-dasharray="18 14">
      <animateTransform attributeName="transform" type="rotate" from="0 190 196" to="360 190 196" dur="7s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <circle cx="190" cy="196" r="26" fill="#000000" stroke="#E36002" stroke-width="2" filter="url(#sg-glow)"/>

  <!-- documents falling in -->
  <g font-family="ui-monospace,monospace" font-size="10" font-weight="bold">
    <g>
      <animateMotion dur="5s" repeatCount="indefinite" path="M 60 90 Q 140 120 168 172" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="5s" repeatCount="indefinite"/>
      <rect x="-18" y="-11" width="36" height="22" rx="4" fill="#111115" stroke="#E36002"/>
      <text x="0" y="4" fill="#F97316" text-anchor="middle">PDF</text>
    </g>
    <g>
      <animateMotion dur="6.5s" begin="1.8s" repeatCount="indefinite" path="M 320 80 Q 250 130 218 170" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="6.5s" begin="1.8s" repeatCount="indefinite"/>
      <rect x="-18" y="-11" width="36" height="22" rx="4" fill="#111115" stroke="#8B5CF6"/>
      <text x="0" y="4" fill="#8B5CF6" text-anchor="middle">IMG</text>
    </g>
    <g>
      <animateMotion dur="5.8s" begin="3.4s" repeatCount="indefinite" path="M 190 320 Q 190 260 190 224" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="5.8s" begin="3.4s" repeatCount="indefinite"/>
      <rect x="-18" y="-11" width="36" height="22" rx="4" fill="#111115" stroke="#E36002"/>
      <text x="0" y="4" fill="#F97316" text-anchor="middle">DOC</text>
    </g>
  </g>

  <!-- beam out -->
  <line x1="216" y1="196" x2="380" y2="196" stroke="#E36002" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="28" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- stages -->
  <g font-family="ui-monospace,'Fira Code',monospace">
    <g>
      <rect x="380" y="130" width="150" height="132" rx="10" fill="#111115" stroke="#8B5CF6" stroke-width="1.5"/>
      <text x="396" y="158" font-size="12" fill="#8B5CF6">01</text>
      <text x="396" y="182" font-size="15" font-weight="bold" fill="#e4e4e7">ocr · python</text>
      <text x="396" y="206" font-size="11.5" fill="#71717a">tesseract</text>
      <text x="396" y="226" font-size="11.5" fill="#71717a">→ texto limpo</text>
      <text x="396" y="248" font-size="10.5" fill="#52525b">instructor / pydantic</text>
    </g>
    <g>
      <rect x="556" y="130" width="150" height="132" rx="10" fill="#111115" stroke="#E36002" stroke-width="1.5"/>
      <text x="572" y="158" font-size="12" fill="#E36002">02</text>
      <text x="572" y="182" font-size="15" font-weight="bold" fill="#e4e4e7">llm · ollama</text>
      <text x="572" y="206" font-size="11.5" fill="#71717a">gera questões</text>
      <text x="572" y="226" font-size="11.5" fill="#71717a">json validado</text>
      <text x="572" y="248" font-size="10.5" fill="#52525b">fila bullmq + redis</text>
    </g>
    <g>
      <rect x="732" y="130" width="140" height="132" rx="10" fill="#111115" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="748" y="158" font-size="12" fill="#38bdf8">03</text>
      <text x="748" y="182" font-size="15" font-weight="bold" fill="#e4e4e7">api · hono</text>
      <text x="748" y="206" font-size="11.5" fill="#71717a">drizzle · pg</text>
      <text x="748" y="226" font-size="11.5" fill="#71717a">react pwa</text>
      <text x="748" y="248" font-size="10.5" fill="#52525b">docker</text>
    </g>
  </g>
  <line x1="530" y1="196" x2="556" y2="196" stroke="#52525b" stroke-width="1.5"/>
  <line x1="706" y1="196" x2="732" y2="196" stroke="#52525b" stroke-width="1.5"/>
  <circle r="4" fill="#E36002"><animateMotion dur="1.8s" repeatCount="indefinite" path="M 216 196 L 380 196"/></circle>
  <circle r="3" fill="#8B5CF6"><animateMotion dur="1.4s" repeatCount="indefinite" path="M 530 196 L 556 196"/></circle>
  <circle r="3" fill="#38bdf8"><animateMotion dur="1.4s" repeatCount="indefinite" path="M 706 196 L 732 196"/></circle>

  <!-- quiz output card -->
  <g>
    <rect x="380" y="292" width="492" height="76" rx="10" fill="#0d0d10" stroke="#2a2a30"/>
    <text x="400" y="322" font-family="ui-monospace,monospace" font-size="12" fill="#71717a">saída:</text>
    <text x="460" y="322" font-family="ui-monospace,monospace" font-size="13" fill="#e4e4e7">quiz renderizado — pergunta + 4 alternativas + gabarito</text>
    <text x="400" y="348" font-family="ui-monospace,monospace" font-size="11.5" fill="#52525b">horizon: fila pública · sangha: revisão humana</text>
  </g>

  <text x="48" y="382" font-family="ui-monospace,monospace" font-size="11" fill="#52525b">documento cru entra pela esquerda · sai questão estruturada · tudo assíncrono, nada bloqueia a request</text>
</svg>
