<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090B" />
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="Singular — transforme provas e PDFs em quizzes interativos. Envie a prova, revise as questões geradas e jogue."
    />
    <meta property="og:title" content="Singular — provas viram quizzes" />
    <meta
      property="og:description"
      content="Transforme provas e PDFs em quizzes interativos: envie, revise e jogue."
    />
    <meta property="og:type" content="website" />
    <title>Singular — Provas viram quizzes</title>
    <script>
      /* FX.LITE no-flash: aplica a classe antes do primeiro paint —
         sem isso o 1º frame renderiza com blur/filters que só somem
         quando o React monta e o useEffect roda. */
      try {
        if (localStorage.getItem('singular:fx-lite') === '1') {
          document.documentElement.classList.add('fx-lite');
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
